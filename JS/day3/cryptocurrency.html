<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 암호화폐 가격 변동 추적기</title>
    <link rel="stylesheet" href="cryptocurrency_style.css">
</head>
<body>
    <div class="container">
        <h1>실시간 암호화폐 가격 변동 추적기</h1>
        <p id="lastUpdated" class="last-updated">업데이트 시각: 불러오는 중...</p>

        <div class="tabs">
            <button id="allTab" class="tab-btn active" type="button">전체보기</button>
            <button id="favoritesTab" class="tab-btn" type="button">관심항목</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="심볼 검색 (예: BTC, ETHUSDT)">
        </div>

        <div id="loading" class="loading">데이터를 불러오는 중...</div>
        <div id="emptyMessage" class="empty-message hidden">표시할 암호화폐가 없습니다.</div>

        <table id="cryptoTable" class="hidden">
            <thead>
                <tr>
                    <th>관심</th>
                    <th>심볼</th>
                    <th>현재가</th>
                    <th>24시간 변동률</th>
                    <th>최고가</th>
                    <th>최저가</th>
                </tr>
            </thead>
            <tbody id="cryptoList"></tbody>
        </table>
    </div>

    <script src="cryptocurrency.js"></script>
</body>
</html>
