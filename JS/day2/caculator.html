<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘솔창 계산기 프로그램</title>
</head>
<body>
  <h1>콘솔창 계산기 프로그램</h1>

  <h3>Window OS의 경우</h3>
  <ol>
    <li>F12 키를 눌러 콘솔 창을 여세요.</li>
    <li><code>start()</code>를 콘솔창에 입력하여 계산기를 실행합니다.</li>
  </ol>

  <h3>Mac OS의 경우</h3>
  <ol>
    <li>Option + Command + i 키를 눌러 콘솔 창을 여세요.</li>
    <li><code>start()</code>를 콘솔창에 입력하여 계산기를 실행합니다.</li>
  </ol>

  <script src="calculator.js"></script>
</body>
</html>
